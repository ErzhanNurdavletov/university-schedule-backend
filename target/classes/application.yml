spring:
  application:
    name: university-schedule-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/university_schedule}
    username: ${SPRING_DATASOURCE_USERNAME:university}
    password: ${SPRING_DATASOURCE_PASSWORD:university}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
