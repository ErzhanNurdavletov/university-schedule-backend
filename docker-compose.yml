services:
  postgres:
    image: postgres:16-alpine
    container_name: university_schedule_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: university_schedule
      POSTGRES_USER: university
      POSTGRES_PASSWORD: university
    ports:
      - "5433:5432"
    volumes:
      - university_schedule_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university -d university_schedule"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  university_schedule_postgres_data:
